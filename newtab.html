<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Saver Dashboard</title>
    <script type="module" src="/src/newtab/main.ts"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <h1>Tab Saver</h1>
          <p id="page-auth-status" class="status"></p>
        </div>
        <div class="row">
          <button id="page-refresh-btn" class="ghost">更新</button>
        </div>
      </header>

      <details>
        <summary>設定</summary>

        <section class="card" id="config-section">
          <h2>Supabase 設定</h2>
          <label class="field">
            <span>Project URL</span>
            <input
              id="supabase-url"
              type="url"
              placeholder="https://xxxx.supabase.co"
            />
          </label>
          <label class="field">
            <span>Publishable / anon key</span>
            <textarea
              id="supabase-key"
              rows="3"
              placeholder="eyJ..."
            ></textarea>
          </label>
          <button id="save-config-btn">設定を保存</button>
          <p class="note">service_role は入れないこと。</p>
        </section>

        <section class="card" id="rules-section">
          <h2>Ignore Rules</h2>
          <label class="field">
            <span>Ignore domains（1行1ルール）</span>
            <textarea
              id="ignore-domains"
              rows="4"
              placeholder="mail.google.com&#10;slack.com&#10;chatgpt.com"
            ></textarea>
          </label>
          <label class="field">
            <span>Ignore titles（1行1ルール）</span>
            <textarea
              id="ignore-titles"
              rows="4"
              placeholder="Inbox&#10;Notifications"
            ></textarea>
          </label>
          <p class="note">
            部分一致で判定します。URL / title に含まれたら保存しません。
          </p>
          <button id="save-config-btn">設定を保存</button>
        </section>

        <section class="card" id="auth-section">
          <h2>認証</h2>
          <label class="field">
            <span>Email</span>
            <input id="email" type="email" placeholder="you@example.com" />
          </label>
          <label class="field">
            <span>Password</span>
            <input id="password" type="password" placeholder="password" />
          </label>
          <div class="row">
            <button id="sign-up-btn" class="ghost">新規登録</button>
            <button id="sign-in-btn">ログイン</button>
            <button id="sign-out-btn">ログアウト</button>
          </div>
          <p id="auth-status"></p>
        </section>
      </details>

      <section class="card">
        <h2>保存済み一覧</h2>
        <label class="field">
          <span>検索</span>
          <input
            id="page-group-search"
            type="search"
            placeholder="グループ名・タブ名・URL で検索"
          />
        </label>
        <div id="page-groups-empty" class="empty">まだ何もありません。</div>
        <div id="page-groups"></div>
      </section>
    </main>
  </body>
</html>
